name: Portfolio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tripback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tripback/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
